spring.application.name=agendamento-test

# Testes rodam contra H2 em memoria, independente do Postgres local estar de pe.
# As migrations Flyway sao escritas para funcionar em ambos (ver comentarios no V1).
spring.datasource.url=jdbc:h2:mem:agendamento_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.admin.api-key=test-admin-key
app.cors.allowed-origin=http://localhost:5173
