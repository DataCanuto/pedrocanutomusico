# Ativado com SPRING_PROFILES_ACTIVE=prod no ambiente de deploy.
#
# ADMIN_API_KEY é obrigatório neste perfil - AdminApiKeyStartupValidator recusa subir a aplicação
# se vier em branco ou igual à chave padrão de desenvolvimento.

app.admin.exigir-https=true

# Faz request.isSecure() refletir o header X-Forwarded-Proto quando a aplicação roda atrás de um
# proxy/load balancer que termina o HTTPS (padrão na maioria das plataformas de deploy).
server.forward-headers-strategy=framework
