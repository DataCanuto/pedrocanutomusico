spring.application.name=agendamento

# Postgres nativo do usuario. Ajuste via variaveis de ambiente se o banco/usuario/senha locais
# forem diferentes (nao versione a senha real - isto aqui e so um fallback de desenvolvimento).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agendamentos_pedrocanuto}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Schema e sempre gerenciado por migration Flyway - nunca pelo Hibernate (CLAUDE.md).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bahia

spring.flyway.enabled=true

app.admin.api-key=${ADMIN_API_KEY:1234}
app.admin.exigir-https=${ADMIN_EXIGIR_HTTPS:false}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

server.port=${SERVER_PORT:8080}
